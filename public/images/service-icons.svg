<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Penetration Testing -->
  <rect x="0" y="0" width="130" height="130" rx="12" fill="#161b27"/>
  <rect x="0" y="0" width="130" height="130" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Target icon -->
  <circle cx="65" cy="52" r="28" fill="none" stroke="url(#s1)" stroke-width="2"/>
  <circle cx="65" cy="52" r="18" fill="none" stroke="url(#s1)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="65" cy="52" r="8" fill="url(#s1)" opacity="0.9"/>
  <!-- Crosshair -->
  <line x1="65" y1="20" x2="65" y2="32" stroke="url(#s1)" stroke-width="2"/>
  <line x1="65" y1="72" x2="65" y2="84" stroke="url(#s1)" stroke-width="2"/>
  <line x1="33" y1="52" x2="45" y2="52" stroke="url(#s1)" stroke-width="2"/>
  <line x1="85" y1="52" x2="97" y2="52" stroke="url(#s1)" stroke-width="2"/>
  <text x="65" y="102" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">Penetration</text>
  <text x="65" y="116" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">Testing</text>

  <!-- Card 2: SOC Monitoring -->
  <rect x="143" y="0" width="130" height="130" rx="12" fill="#161b27"/>
  <rect x="143" y="0" width="130" height="130" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Monitor/eye icon -->
  <rect x="158" y="28" width="100" height="62" rx="6" fill="none" stroke="url(#s2)" stroke-width="2"/>
  <rect x="198" y="90" width="20" height="10" fill="url(#s2)" opacity="0.5"/>
  <rect x="183" y="100" width="50" height="3" rx="1.5" fill="url(#s2)" opacity="0.5"/>
  <!-- Eye inside monitor -->
  <ellipse cx="208" cy="59" rx="22" ry="14" fill="none" stroke="url(#s2)" stroke-width="1.5"/>
  <circle cx="208" cy="59" r="7" fill="url(#s2)" opacity="0.9"/>
  <circle cx="210" cy="57" r="2.5" fill="#0d1117"/>
  <!-- Pulse line -->
  <polyline points="158,59 170,59 175,47 180,71 185,55 190,63 195,59 208,59"
            fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <text x="208" y="116" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">SOC Monitoring</text>

  <!-- Card 3: Incident Response -->
  <rect x="286" y="0" width="130" height="130" rx="12" fill="#161b27"/>
  <rect x="286" y="0" width="130" height="130" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Alert/lightning icon -->
  <polygon points="351,22 333,58 349,58 345,88 369,48 352,48"
           fill="url(#s3)" opacity="0.9"/>
  <!-- Pulse rings -->
  <circle cx="351" cy="55" r="38" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.2"/>
  <circle cx="351" cy="55" r="28" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.15"/>
  <text x="351" y="110" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">Incident</text>
  <text x="351" y="124" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">Response</text>

  <!-- Card 4: Compliance -->
  <rect x="429" y="0" width="130" height="130" rx="12" fill="#161b27"/>
  <rect x="429" y="0" width="130" height="130" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Clipboard/check icon -->
  <rect x="459" y="25" width="70" height="82" rx="6" fill="none" stroke="url(#s4)" stroke-width="2"/>
  <rect x="474" y="18" width="40" height="16" rx="4" fill="url(#s4)" opacity="0.8"/>
  <!-- Check lines -->
  <polyline points="465,52 471,59 483,46" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="489" y1="52" x2="521" y2="52" stroke="#1e293b" stroke-width="1.5"/>
  <polyline points="465,68 471,75 483,62" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="489" y1="68" x2="521" y2="68" stroke="#1e293b" stroke-width="1.5"/>
  <polyline points="465,84 471,91 483,78" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="489" y1="84" x2="521" y2="84" stroke="#1e293b" stroke-width="1.5"/>
  <text x="494" y="116" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="600"
        fill="#e2e8f0" text-anchor="middle">Compliance</text>
</svg>
