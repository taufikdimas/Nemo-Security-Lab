<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b27;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40" x2="520" y2="40"/>
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="200" x2="520" y2="200"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="280" x2="520" y2="280"/>
    <line x1="0" y1="320" x2="520" y2="320"/>
    <line x1="0" y1="360" x2="520" y2="360"/>
    <line x1="65" y1="0" x2="65" y2="400"/>
    <line x1="130" y1="0" x2="130" y2="400"/>
    <line x1="195" y1="0" x2="195" y2="400"/>
    <line x1="260" y1="0" x2="260" y2="400"/>
    <line x1="325" y1="0" x2="325" y2="400"/>
    <line x1="390" y1="0" x2="390" y2="400"/>
    <line x1="455" y1="0" x2="455" y2="400"/>
  </g>

  <!-- Glow orb behind shield -->
  <circle cx="260" cy="200" r="130" fill="#06b6d4" opacity="0.04" filter="url(#softglow)"/>
  <circle cx="260" cy="200" r="90" fill="#3b82f6" opacity="0.06" filter="url(#softglow)"/>

  <!-- Main Shield -->
  <path d="M260 60 L360 100 L360 195 C360 258 316 298 260 318 C204 298 160 258 160 195 L160 100 Z"
        fill="url(#shieldHero)" opacity="0.12"/>
  <path d="M260 60 L360 100 L360 195 C360 258 316 298 260 318 C204 298 160 258 160 195 L160 100 Z"
        fill="none" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow2)"/>

  <!-- Shield inner -->
  <path d="M260 82 L340 114 L340 193 C340 246 304 278 260 295 C216 278 180 246 180 193 L180 114 Z"
        fill="#06b6d4" opacity="0.05"/>

  <!-- Lock icon in shield center -->
  <rect x="234" y="182" width="52" height="42" rx="6" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow2)"/>
  <path d="M246 182 L246 168 C246 152 274 152 274 168 L274 182" stroke="url(#cyanGrad)" stroke-width="4" fill="none" filter="url(#glow2)"/>
  <circle cx="260" cy="200" r="6" fill="#0d1117"/>
  <rect x="258" y="200" width="4" height="10" rx="2" fill="#0d1117"/>

  <!-- Scan line -->
  <rect x="160" y="99" width="200" height="1.5" fill="#06b6d4" opacity="0.6" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,220;0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Orbiting nodes / network -->
  <circle cx="260" cy="200" r="120" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6"/>
  <circle cx="260" cy="200" r="155" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,8"/>

  <!-- Node points on orbit -->
  <g filter="url(#glow2)">
    <circle cx="380" cy="200" r="8" fill="#06b6d4" opacity="0.9"/>
    <circle cx="140" cy="200" r="6" fill="#3b82f6" opacity="0.9"/>
    <circle cx="260" cy="80" r="7" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="350" cy="105" r="5" fill="#06b6d4" opacity="0.7"/>
    <circle cx="170" cy="105" r="5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="350" cy="295" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="170" cy="295" r="5" fill="#06b6d4" opacity="0.7"/>
    <circle cx="415" cy="140" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="105" cy="260" r="5" fill="#f97316" opacity="0.8"/>
  </g>

  <!-- Connection lines from nodes -->
  <g stroke="#06b6d4" stroke-width="0.8" opacity="0.3">
    <line x1="380" y1="200" x2="340" y2="182"/>
    <line x1="140" y1="200" x2="180" y2="193"/>
    <line x1="350" y1="105" x2="310" y2="130"/>
    <line x1="170" y1="105" x2="210" y2="130"/>
    <line x1="415" y1="140" x2="380" y2="200"/>
    <line x1="105" y1="260" x2="140" y2="200"/>
  </g>

  <!-- Alert cards floating -->
  <!-- Card 1: THREAT DETECTED -->
  <g transform="translate(22, 60)">
    <rect width="140" height="52" rx="8" fill="#161b27" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="4" height="52" rx="2" fill="#ef4444"/>
    <text x="14" y="18" font-family="'Inter','Segoe UI',monospace" font-size="8" font-weight="700"
          fill="#ef4444" letter-spacing="1">THREAT DETECTED</text>
    <text x="14" y="32" font-family="'Inter','Segoe UI',monospace" font-size="9" fill="#e2e8f0">Brute Force — SSH</text>
    <text x="14" y="44" font-family="'Inter','Segoe UI',monospace" font-size="8" fill="#64748b">src: 45.142.120.98</text>
    <circle cx="125" cy="12" r="5" fill="#ef4444" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 2: STATUS OK -->
  <g transform="translate(358, 290)">
    <rect width="136" height="52" rx="8" fill="#161b27" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="4" height="52" rx="2" fill="#10b981"/>
    <text x="14" y="18" font-family="'Inter','Segoe UI',monospace" font-size="8" font-weight="700"
          fill="#10b981" letter-spacing="1">SCAN COMPLETE</text>
    <text x="14" y="32" font-family="'Inter','Segoe UI',monospace" font-size="9" fill="#e2e8f0">srv-proxy-01</text>
    <text x="14" y="44" font-family="'Inter','Segoe UI',monospace" font-size="8" fill="#64748b">0 critical findings</text>
    <circle cx="121" cy="12" r="5" fill="#10b981" opacity="0.9"/>
  </g>

  <!-- Card 3: ALERT -->
  <g transform="translate(358, 56)">
    <rect width="136" height="52" rx="8" fill="#161b27" stroke="#f97316" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="4" height="52" rx="2" fill="#f97316"/>
    <text x="14" y="18" font-family="'Inter','Segoe UI',monospace" font-size="8" font-weight="700"
          fill="#f97316" letter-spacing="1">HIGH SEVERITY</text>
    <text x="14" y="32" font-family="'Inter','Segoe UI',monospace" font-size="9" fill="#e2e8f0">CVE-2024-38819</text>
    <text x="14" y="44" font-family="'Inter','Segoe UI',monospace" font-size="8" fill="#64748b">CVSS: 8.1 · Laravel</text>
  </g>

  <!-- Card 4: USER LOGIN -->
  <g transform="translate(22, 288)">
    <rect width="140" height="52" rx="8" fill="#161b27" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="4" height="52" rx="2" fill="#3b82f6"/>
    <text x="14" y="18" font-family="'Inter','Segoe UI',monospace" font-size="8" font-weight="700"
          fill="#3b82f6" letter-spacing="1">AUTH EVENT</text>
    <text x="14" y="32" font-family="'Inter','Segoe UI',monospace" font-size="9" fill="#e2e8f0">budi.santoso login</text>
    <text x="14" y="44" font-family="'Inter','Segoe UI',monospace" font-size="8" fill="#64748b">10.20.10.7 · SOC</text>
  </g>

  <!-- Bottom stats bar -->
  <rect x="0" y="365" width="520" height="35" fill="#161b27" rx="0"/>
  <rect x="0" y="365" width="520" height="35" rx="0 0 16 16" fill="#161b27"/>
  <g font-family="'Inter','Segoe UI',monospace" font-size="9" fill="#64748b">
    <text x="24" y="386">ASSETS MONITORED</text>
    <text x="24" y="378" fill="#06b6d4" font-size="12" font-weight="700">18</text>
    <line x1="130" y1="370" x2="130" y2="395" stroke="#1e293b"/>
    <text x="145" y="386">OPEN INCIDENTS</text>
    <text x="145" y="378" fill="#ef4444" font-size="12" font-weight="700">6</text>
    <line x1="240" y1="370" x2="240" y2="395" stroke="#1e293b"/>
    <text x="255" y="386">THREATS BLOCKED</text>
    <text x="255" y="378" fill="#10b981" font-size="12" font-weight="700">1,247</text>
    <line x1="370" y1="370" x2="370" y2="395" stroke="#1e293b"/>
    <text x="385" y="386">UPTIME</text>
    <text x="385" y="378" fill="#3b82f6" font-size="12" font-weight="700">99.8%</text>
  </g>
</svg>
