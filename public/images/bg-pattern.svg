<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hexGrid" width="60" height="52" patternUnits="userSpaceOnUse">
      <!-- Single hexagon tile -->
      <polygon points="30,2 56,17 56,47 30,62 4,47 4,17"
               fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1e293b" opacity="0.5"/>
    </pattern>
    <radialGradient id="fadeOut" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0f1117;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Base dark background -->
  <rect width="800" height="600" fill="#0f1117"/>

  <!-- Hex grid -->
  <rect width="800" height="600" fill="url(#hexGrid)"/>

  <!-- Fade to dark at edges -->
  <rect width="800" height="600" fill="url(#fadeOut)"/>

  <!-- Glowing accent lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="url(#glowLine)" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="url(#glowLine)" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="url(#glowLine)" stroke-width="1" opacity="0.4"/>

  <!-- Vertical accent -->
  <linearGradient id="glowLineV" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
    <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
  </linearGradient>
  <line x1="200" y1="0" x2="200" y2="600" stroke="url(#glowLineV)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="url(#glowLineV)" stroke-width="1" opacity="0.5"/>

  <!-- Glowing nodes -->
  <g opacity="0.7">
    <circle cx="200" cy="150" r="4" fill="#06b6d4" filter="url(#softGlow)"/>
    <circle cx="600" cy="150" r="4" fill="#3b82f6"/>
    <circle cx="200" cy="450" r="4" fill="#3b82f6"/>
    <circle cx="600" cy="450" r="4" fill="#06b6d4"/>
    <circle cx="400" cy="300" r="6" fill="#06b6d4" opacity="0.5"/>
  </g>

  <!-- Data stream effect - horizontal moving lines -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="80" x2="160" y2="80">
      <animate attributeName="x1" values="-160;800" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;960" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="220" x2="80" y2="220">
      <animate attributeName="x1" values="-80;800" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="x2" values="0;880" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="0" y1="380" x2="200" y2="380">
      <animate attributeName="x1" values="-200;800" dur="8s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="x2" values="0;1000" dur="8s" repeatCount="indefinite" begin="2s"/>
    </line>
  </g>
</svg>
