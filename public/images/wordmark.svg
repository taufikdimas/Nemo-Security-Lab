<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="wGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mini shield icon -->
  <path d="M10 6 L34 14 L34 33 C34 44 24 51 10 56 C-4 51 -14 44 -14 33 L-14 14 Z"
        transform="translate(20,0)" fill="url(#wGrad)" filter="url(#wGlow)"/>
  <path d="M10 10 L28 17 L28 33 C28 42 20 48 10 52 C0 48 -8 42 -8 33 L-8 17 Z"
        transform="translate(20,0)" fill="#0d1117" opacity="0.65"/>
  <!-- Lock small -->
  <rect x="25" y="28" width="10" height="8" rx="1.5" fill="#06b6d4" opacity="0.95"/>
  <path d="M27 28 L27 25 C27 22.5 33 22.5 33 25 L33 28" stroke="#06b6d4" stroke-width="1.5" fill="none"/>
  <circle cx="30" cy="31.5" r="1.2" fill="#0d1117"/>

  <!-- SECURE text -->
  <text x="56" y="37" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="800"
        letter-spacing="-0.5" fill="url(#wGrad)">SECURE</text>

  <!-- OPS text -->
  <text x="173" y="37" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="300"
        letter-spacing="1" fill="#94a3b8">OPS</text>

  <!-- Tagline -->
  <text x="56" y="50" font-family="'Inter','Segoe UI',sans-serif" font-size="8" font-weight="400"
        letter-spacing="2.5" fill="#475569">PT GARUDA SIBER NUSANTARA</text>

  <!-- Accent dot between SECURE and OPS -->
  <circle cx="169" cy="31" r="2.5" fill="#06b6d4"/>
</svg>
