<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <ellipse cx="100" cy="105" rx="72" ry="75" fill="url(#glowGrad)" opacity="0.5"/>

  <!-- Shield shape -->
  <path d="M100 18 L168 48 L168 105 C168 145 138 172 100 185 C62 172 32 145 32 105 L32 48 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield inner dark -->
  <path d="M100 30 L156 56 L156 105 C156 138 130 162 100 173 C70 162 44 138 44 105 L44 56 Z"
        fill="#0d1117" opacity="0.6"/>

  <!-- Circuit lines -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.7" fill="none">
    <line x1="100" y1="62" x2="100" y2="78"/>
    <line x1="78" y1="78" x2="122" y2="78"/>
    <line x1="78" y1="78" x2="78" y2="95"/>
    <line x1="122" y1="78" x2="122" y2="95"/>
    <line x1="78" y1="95" x2="100" y2="95"/>
    <line x1="100" y1="95" x2="122" y2="95"/>
    <line x1="100" y1="95" x2="100" y2="115"/>
    <!-- Nodes -->
    <circle cx="100" cy="62" r="3" fill="#06b6d4"/>
    <circle cx="78" cy="78" r="2.5" fill="#3b82f6"/>
    <circle cx="122" cy="78" r="2.5" fill="#3b82f6"/>
    <circle cx="78" cy="95" r="2.5" fill="#06b6d4"/>
    <circle cx="122" cy="95" r="2.5" fill="#06b6d4"/>
    <circle cx="100" cy="95" r="3" fill="#ffffff"/>
    <circle cx="100" cy="115" r="4" fill="#06b6d4"/>
  </g>

  <!-- Lock icon center -->
  <rect x="87" y="107" width="26" height="20" rx="3" fill="#06b6d4" opacity="0.9"/>
  <path d="M93 107 L93 101 C93 96 107 96 107 101 L107 107" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.9"/>
  <circle cx="100" cy="115" r="2.5" fill="#0d1117"/>

  <!-- Scan line animation -->
  <rect x="44" y="55" width="112" height="2" fill="#06b6d4" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,118;0,0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
